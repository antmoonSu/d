<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应商管理系统</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Load React from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Load the component -->
  <script src="./prototypes/supplier-management.js"></script>

  <!-- Render the component -->
  <script>
    (function() {
      const rootElement = document.getElementById('root');

      if (!rootElement) {
        console.error('Root element not found');
        return;
      }

      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
        rootElement.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>加载失败</h1><p>React 未正确加载</p></div>';
        return;
      }

      if (typeof UserComponent === 'undefined') {
        rootElement.innerHTML = '<div style="padding: 40px; text-align: center;"><h1>加载失败</h1><p>组件未正确加载</p></div>';
        return;
      }

      // Create root and render
      const root = ReactDOM.createRoot(rootElement);
      root.render(React.createElement(UserComponent));
    })();
  </script>
</body>
</html>
